name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Quality gates
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked
          bash -n install.sh

      - uses: actions/setup-node@v6
        with:
          node-version: "22.22.0"

      - name: Offline Browser Use regression checks
        run: |
          cargo build --locked
          python3 -m venv "$RUNNER_TEMP/browser-tests"
          "$RUNNER_TEMP/browser-tests/bin/pip" install pyte==0.8.2
          python3 tests/browser_runtime_test.py
          ZCODE_TEST_BIN=target/debug/zcode-tui "$RUNNER_TEMP/browser-tests/bin/python" tests/browser_smoke.py

  native-tests:
    name: native tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: macos-arm64
            os: macos-latest
          - name: macos-x64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Run native tests
        run: cargo test --locked
