name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl

      - name: Quality gates
        run: |
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --locked

      - name: Build static binary
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Package
        run: |
          BIN=zcode-tui-x86_64-unknown-linux-musl
          cp target/x86_64-unknown-linux-musl/release/zcode-tui "$BIN"
          sha256sum "$BIN" install.sh > SHA256SUMS
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if ! [ -s RELEASE_NOTES.md ]; then
            echo "See CHANGELOG.md." > RELEASE_NOTES.md
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "zcode-tui $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            zcode-tui-x86_64-unknown-linux-musl SHA256SUMS install.sh
