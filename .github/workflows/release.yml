name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Quality gates
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked
          bash -n install.sh

  build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            source: target/x86_64-unknown-linux-musl/release/zcode-tui
            asset: zcode-tui-x86_64-unknown-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            source: target/x86_64-pc-windows-msvc/release/zcode-tui.exe
            asset: zcode-tui-x86_64-pc-windows-msvc.exe
          - os: macos-15-intel
            target: x86_64-apple-darwin
            source: target/x86_64-apple-darwin/release/zcode-tui
            asset: zcode-tui-x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
            source: target/aarch64-apple-darwin/release/zcode-tui
            asset: zcode-tui-aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Run native tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Smoke-test release binary
        shell: bash
        run: |
          actual="$("${{ matrix.source }}" --version)"
          expected="zcode-tui ${GITHUB_REF_NAME#v}"
          test "$actual" = "$expected"

      - name: Name release asset
        shell: bash
        run: cp "${{ matrix.source }}" "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      - name: Package release
        run: |
          cp install.sh dist/
          cd dist
          sha256sum zcode-tui-* install.sh > SHA256SUMS

          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' ../CHANGELOG.md > RELEASE_NOTES.md
          if ! [ -s RELEASE_NOTES.md ]; then
            echo "See CHANGELOG.md." > RELEASE_NOTES.md
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber \
              dist/zcode-tui-* dist/SHA256SUMS dist/install.sh
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "zcode-tui $GITHUB_REF_NAME" \
              --notes-file dist/RELEASE_NOTES.md \
              dist/zcode-tui-* dist/SHA256SUMS dist/install.sh
          fi
