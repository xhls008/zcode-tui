[package]
name = "zcode-tui"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "A Rust fallback terminal UI for ZCode Linux builds without @zcode/tui."
repository = "https://github.com/xhls008/zcode-tui"

[lib]
name = "zcode_tui"
path = "src/lib.rs"

[[bin]]
name = "zcode-tui"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
crossterm = "0.28"
pulldown-cmark = { version = "0.12", default-features = false }
ratatui = "0.29"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shell-words = "1.1"
syntect = { version = "5.2", default-features = false, features = [
    "parsing",
    "default-syntaxes",
    "default-themes",
    "dump-load",
    "regex-fancy",
] }
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.13"
