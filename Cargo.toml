[package]
name = "zcode-tui"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A Rust fallback terminal UI for ZCode Linux builds without @zcode/tui."
repository = "https://github.com/flybear/zcode-tui"

[lib]
name = "zcode_tui"
path = "src/lib.rs"

[[bin]]
name = "zcode-tui"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shell-words = "1.1"

[dev-dependencies]
tempfile = "3.13"
